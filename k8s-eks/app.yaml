# Applied with envsubst: ${ECR} = <account>.dkr.ecr.<region>.amazonaws.com, ${TAG} = image tag
apiVersion: v1
kind: Namespace
metadata: {name: hyd-shop}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: hyd-shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      containers:
      - name: catalog
        image: ${ECR}/hyd-shop/catalog:${TAG}
        ports: [{containerPort: 3000}]
        readinessProbe: {httpGet: {path: /health, port: 3000}}
        livenessProbe: {httpGet: {path: /health, port: 3000}, initialDelaySeconds: 10}
        resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 300m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: catalog, namespace: hyd-shop}
spec: {selector: {app: catalog}, ports: [{port: 3000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: hyd-shop}
spec:
  replicas: 1   # in-memory orders; raise only after adding a database
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
      - name: orders
        image: ${ECR}/hyd-shop/orders:${TAG}
        ports: [{containerPort: 3000}]
        readinessProbe: {httpGet: {path: /health, port: 3000}}
        resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 300m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: orders, namespace: hyd-shop}
spec: {selector: {app: orders}, ports: [{port: 3000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: hyd-shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: nginx
        image: ${ECR}/hyd-shop/frontend:${TAG}
        ports: [{containerPort: 80}]
        readinessProbe: {httpGet: {path: /, port: 80}}
        resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 200m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: hyd-shop}
spec: {selector: {app: frontend}, ports: [{port: 80}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hyd-shop
  namespace: hyd-shop
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: frontend, port: {number: 80}}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: catalog, namespace: hyd-shop}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: catalog}
  minReplicas: 2
  maxReplicas: 6
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
